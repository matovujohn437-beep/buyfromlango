name: buy_from_lango
description: Buy From Lango marketplace for rural farmers and buyers in Lango, Uganda.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cached_network_image: ^3.3.0
  emoji_picker_flutter: ^3.0.0
  flutter_riverpod: ^2.4.10
  flutter_image_compress: ^2.1.0
  cupertino_icons: ^1.0.0
  flutter_svg: ^2.0.0
  go_router: ^14.2.7
  google_fonts: ^6.2.1
  google_sign_in: ^7.2.0
  image_picker: ^1.1.2
  intl: ^0.19.0
  just_audio: ^0.9.41
  lottie: ^3.1.2
  record: ^5.1.0
  shared_preferences: ^2.2.1
  shimmer: ^3.0.0
  supabase_flutter: ^2.8.0
  video_player: ^2.1.0
  url_launcher: ^6.3.2
  file_picker: ^11.0.3
  flutter_background_service: ^5.1.0
  telephony: ^0.2.0
  flutter_secure_storage: ^10.3.4
  timeago: ^3.7.1
  connectivity_plus: ^7.3.1
  intl_phone_field: ^3.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

dependency_overrides:
  record: 5.1.0
  record_android: 1.2.1
  record_linux: 0.7.1
  record_web: 1.1.2
  record_windows: 1.0.2
  record_platform_interface: 1.0.2
  # web: ^1.1.0  <-- REMOVE THIS LINE^1.1.0  

flutter:
  uses-material-design: true

  assets:
    - assets/icons/
    - assets/illustrations/
    - assets/lottie/
    - assets/images/

